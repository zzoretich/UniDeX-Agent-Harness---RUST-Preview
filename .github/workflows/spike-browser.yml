name: spike-browser

# Temporary: builds the Task 12 browser trial (spikes/browser, decision 0012) on the three
# platforms. Removed when the trial ends. It runs only for pull requests that touch the trial
# or this file, and never on main.
#
# Same hardening as ci.yml: read-only token, no credentials kept by checkout, every action
# pinned to a full commit hash, fixed runner labels, no secrets, no event text in scripts.
#
# The CEF binary distribution is downloaded here, on the runners. Each archive is pinned by
# SHA-256 (from the .sha256 file CEF's build host publishes next to it), checked before it is
# unpacked, and unpacked by spikes/browser/unpack-cef.sh into the layout the bindings' build
# script expects, so the build script downloads nothing (CEF_DOWNLOAD_URL points at a host that
# does not exist, so an attempt would fail the build instead of fetching).
#
# What each platform exercises (decision 0012): the helper starts off-screen, loads a page,
# produces at least one frame into the shared-memory transport, answers a DevTools evaluate,
# reports each sub-process's sandbox state, and exits by itself with status 0.

on:
  pull_request:
    paths:
      - "spikes/browser/**"
      - ".github/workflows/spike-browser.yml"

permissions:
  contents: read

concurrency:
  group: spike-browser-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # CEF 156.0.30+g6028375, Chromium 156.0.8078.96: what the pinned `cef = "=156.6.0"` targets.
  CEF_VERSION: "156.0.30"
  CEF_BUILD: "cef_binary_156.0.30+g6028375+chromium-156.0.8078.96"
  CEF_HOST: "https://cef-builds.spotifycdn.com"

jobs:
  # The protocol, the stand-in and the GPUI app: no CEF. The headless smoke check runs the
  # stand-in through the real pipes and shared memory on each platform.
  standin:
    name: stand-in (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-26
          - name: linux
            os: ubuntu-26.04
          - name: windows
            os: windows-2025
    defaults:
      run:
        shell: bash
        working-directory: spikes/browser
    steps:
      - name: Keep line endings as committed
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          set -eu
          rustup toolchain install
          cargo --version
      - name: Install the Linux packages GPUI builds against
        if: runner.os == 'Linux'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libxcb1-dev libxkbcommon-x11-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Build (no CEF)
        run: cargo build --release --locked
      - name: Smoke check with the stand-in
        run: |
          set -eu
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          "target/release/spike-smoke$ext" --frames 60 --expect-marker -- "target/release/spike-standin$ext"

  # The CEF helper, with CEF downloaded on the runner.
  cef:
    name: cef helper (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-26
            platform: macosarm64
            folder: cef_macos_aarch64
            # SHA-256 of ${CEF_BUILD}_macosarm64_minimal.tar.bz2 (134,874,408 bytes).
            sha256: 731b599e78c71bf33530d65bfa18963f7d1d59902c1f381f5452188e5116b855
          - name: linux
            os: ubuntu-26.04
            platform: linux64
            folder: cef_linux_x86_64
            # SHA-256 of ${CEF_BUILD}_linux64_minimal.tar.bz2 (333,332,290 bytes).
            sha256: 356db99d653698aa9ba78b22965032b4fa5b23ba079ffdbaa5d28a8530f04011
          - name: windows
            os: windows-2025
            platform: windows64
            folder: cef_windows_x86_64
            # SHA-256 of ${CEF_BUILD}_windows64_minimal.tar.bz2 (175,176,258 bytes).
            sha256: 74fd321975e99703acd8fc7e3c1b0859292f61b388f4052a0cd7ef1fb3b29f6e
    env:
      CEF_PLATFORM: ${{ matrix.platform }}
      CEF_FOLDER: ${{ matrix.folder }}
      CEF_SHA256: ${{ matrix.sha256 }}
      CEF_DOWNLOAD_URL: "https://cef-download-disabled.example.com"
    defaults:
      run:
        shell: bash
        working-directory: spikes/browser
    steps:
      - name: Keep line endings as committed
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          set -eu
          rustup toolchain install
          cargo --version
      # The bindings build CEF's C++ wrapper with CMake and Ninja. Linux also needs the libraries
      # libcef.so links against (installed one by one, so a name that changed in this Ubuntu
      # release is reported rather than failing the step; ldd below shows what is still missing)
      # and a virtual display.
      - name: Install CMake, Ninja, CEF's Linux libraries and a virtual display
        if: runner.os == 'Linux'
        run: |
          set -u
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build xvfb xauth
          for p in libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libgbm1 \
                   libpango-1.0-0 libcairo2 libxcomposite1 libxdamage1 libxrandr2 libxfixes3 libxext6 \
                   libxkbcommon0 libasound2t64 libdbus-1-3 libexpat1 libglib2.0-0t64 libx11-xcb1 \
                   libxshmfence1 libgtk-3-0t64; do
            sudo apt-get install -y --no-install-recommends "$p" >/dev/null 2>&1 || echo "package not installed: $p"
          done
      - name: Install CMake and Ninja (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eu
          command -v cmake || brew install cmake
          command -v ninja || brew install ninja
          cmake --version
          ninja --version
      - name: Download, verify and unpack the CEF distribution
        run: |
          set -eu
          dl="$RUNNER_TEMP/cef-download"
          mkdir -p "$dl"
          file="${CEF_BUILD}_${CEF_PLATFORM}_minimal.tar.bz2"
          url="$CEF_HOST/$(printf '%s' "$file" | sed 's/+/%2B/g')"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$dl/$file" "$url"
          if command -v sha256sum >/dev/null; then
            echo "$CEF_SHA256  $dl/$file" | sha256sum -c -
          else
            echo "$CEF_SHA256  $dl/$file" | shasum -a 256 -c -
          fi
          ls -l "$dl"
          ./unpack-cef.sh "$dl/$file" "$RUNNER_TEMP/cef" "$CEF_VERSION" "$CEF_FOLDER"
          echo "CEF_PATH=$RUNNER_TEMP/cef" >> "$GITHUB_ENV"
          echo "CEF_DIR=$RUNNER_TEMP/cef/$CEF_VERSION/$CEF_FOLDER" >> "$GITHUB_ENV"
      - name: Build the CEF helper and the smoke check
        if: runner.os != 'Windows'
        run: |
          set -eu
          # On Linux the helper finds libcef.so beside itself (the build script copies the
          # runtime files there), not through LD_LIBRARY_PATH, which the setuid sandbox drops.
          if [ "$RUNNER_OS" = "Linux" ]; then export RUSTFLAGS='-C link-arg=-Wl,-rpath,$ORIGIN'; fi
          cargo build --release --locked -p spike-cef-helper --features cef
          cargo build --release --locked -p spike-protocol
      # Windows: Chromium's sandbox needs CEF's bootstrap executable loading the client as a DLL
      # (CEF M138 and later). The helper is built as spike-cef-helper.dll (crate cef-helper-win,
      # exporting RunConsoleMain) and bootstrapc.exe from the distribution becomes
      # spike-cef-helper.exe. Ninja with MSVC needs the compiler's environment from vcvars64.bat.
      - name: Build the CEF helper DLL and the smoke check (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cargo build --release --locked -p spike-cef-helper-win || exit /b 1
          cargo build --release --locked -p spike-protocol || exit /b 1
      - name: Arrange the bootstrap and the helper DLL (Windows)
        if: runner.os == 'Windows'
        run: |
          set -eu
          ls "$CEF_DIR" | grep -i -E '\.exe$' || true
          cp "$CEF_DIR/bootstrapc.exe" target/release/spike-cef-helper.exe
          cp target/release/spike_cef_helper_win.dll target/release/spike-cef-helper.dll
          ls -l target/release/spike-cef-helper.exe target/release/spike-cef-helper.dll target/release/libcef.dll
      - name: Sizes of the CEF component
        run: |
          set -eu
          du -sh "$RUNNER_TEMP/cef-download"/*.tar.bz2
          du -sh "$CEF_DIR"
          if [ "$RUNNER_OS" = "Linux" ]; then
            ldd target/release/libcef.so | grep 'not found' || echo "libcef.so: every library found"
          fi
      - name: Bundle and smoke-check the CEF helper (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eu
          cef-helper/bundle-macos.sh "$CEF_DIR" target/release
          log="$RUNNER_TEMP/smoke-macos.log"
          target/release/spike-smoke --frames 1 --timeout-s 90 --hold-s 8 --expect-sandbox -- \
            target/release/spike-cef-helper.app/Contents/MacOS/spike-cef-helper \
            --profile-dir "$RUNNER_TEMP/cef-profile" >"$log" 2>&1 &
          smoke=$!
          ./ci-while-holding.sh "$log" "lsof -nP -iTCP -sTCP:LISTEN"
          status=0
          wait "$smoke" || status=$?
          cat "$log"
          exit $status
      # Linux sandbox, two ways. A tarball cannot install a setuid helper, so Chromium needs
      # unprivileged user namespaces, which Ubuntu restricts with AppArmor since 23.10; this run
      # records what happens then (it may fail; that is a finding, not an error).
      - name: Linux, tarball-style run (no setuid sandbox helper)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          set -u
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone || true
          ls -l target/release/chrome-sandbox || true
          xvfb-run -a target/release/spike-smoke --frames 1 --timeout-s 90 --hold-s 3 --expect-sandbox -- \
            target/release/spike-cef-helper --profile-dir "$RUNNER_TEMP/cef-profile-tar"
      # The same files installed as a .deb, which can ship chrome-sandbox owned by root with the
      # setuid bit; the smoke check requires every renderer, GPU and utility process to run with
      # a seccomp filter.
      - name: Linux, .deb install with the setuid sandbox helper
        if: runner.os == 'Linux'
        run: |
          set -eu
          stage="$RUNNER_TEMP/deb"
          opt="$stage/opt/unidex-browser-trial"
          mkdir -p "$opt" "$stage/DEBIAN"
          cp target/release/spike-cef-helper target/release/spike-smoke "$opt/"
          for f in "$CEF_DIR"/*; do
            case "$(basename "$f")" in
              cmake|include|libcef_dll|CMakeLists.txt|archive.json) ;;
              *) cp -R "$f" "$opt/" ;;
            esac
          done
          chmod 4755 "$opt/chrome-sandbox"
          printf '%s\n' "Package: unidex-browser-trial" "Version: 0.0.0" "Architecture: amd64" \
            "Maintainer: trial <trial@example.com>" "Description: Task 12 browser trial" > "$stage/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$stage" "$RUNNER_TEMP/trial.deb"
          sudo dpkg -i "$RUNNER_TEMP/trial.deb"
          ls -l /opt/unidex-browser-trial/chrome-sandbox
          du -sh /opt/unidex-browser-trial
          log="$RUNNER_TEMP/smoke-deb.log"
          xvfb-run -a /opt/unidex-browser-trial/spike-smoke --frames 1 --timeout-s 90 --hold-s 8 --expect-sandbox -- \
            /opt/unidex-browser-trial/spike-cef-helper --profile-dir "$RUNNER_TEMP/cef-profile-deb" >"$log" 2>&1 &
          smoke=$!
          ./ci-while-holding.sh "$log" "sudo ss -ltnp"
          status=0
          wait "$smoke" || status=$?
          cat "$log"
          exit $status
      # The tree of processes is not read on Windows; the helper logs whether the bootstrap
      # handed it sandbox information, and CEF's log would report a sandbox failure.
      - name: Smoke-check the helper under the bootstrap (Windows)
        if: runner.os == 'Windows'
        run: |
          set -u
          status=0
          target/release/spike-smoke.exe --frames 1 --timeout-s 90 --hold-s 3 -- \
            target/release/spike-cef-helper.exe --profile-dir "$RUNNER_TEMP/cef-profile" || status=$?
          echo "CEF log (warnings and errors):"
          cat "$RUNNER_TEMP/cef-profile/cef.log" 2>/dev/null | tail -40 || true
          exit $status
