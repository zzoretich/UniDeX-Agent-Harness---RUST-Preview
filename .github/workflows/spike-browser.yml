name: spike-browser

# Temporary: builds the Task 12 browser trial (spikes/browser, decision 0012) on the three
# platforms. Removed when the trial ends. It runs only for pull requests that touch the trial
# or this file, and never on main.
#
# Same hardening as ci.yml: read-only token, no credentials kept by checkout, every action
# pinned to a full commit hash, fixed runner labels, no secrets, no event text in scripts.
#
# The CEF binary distribution is downloaded here, on the runners. Each archive is pinned by
# SHA-256 (from the .sha256 file CEF's build host publishes next to it), checked before it is
# unpacked, and unpacked by spikes/browser/unpack-cef.sh into the layout the bindings' build
# script expects, so the build script downloads nothing (CEF_DOWNLOAD_URL points at a host that
# does not exist, so an attempt would fail the build instead of fetching).
#
# What each platform exercises (decision 0012): the helper starts off-screen, loads a page,
# produces at least one frame into the shared-memory transport, answers a DevTools evaluate,
# reports each sub-process's sandbox state, and exits by itself with status 0. No step passes a
# switch that turns Chromium's sandbox off or weakens it; sudo is used only to install packages,
# the setuid sandbox helper (as a .deb) and an AppArmor profile, the two documented ways to give
# Chromium its sandbox on Ubuntu. Outcomes that do not fail the job (the tarball-style run, the
# socket check) appear as warning annotations and in the step summary.
#
# Hosted macOS runners are scarce: the macOS jobs may be cancelled unqueued (capacity, not a
# result) and are re-run by hand.

on:
  pull_request:
    paths:
      - "spikes/browser/**"
      - ".github/workflows/spike-browser.yml"

permissions:
  contents: read

concurrency:
  group: spike-browser-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # CEF 156.0.30+g6028375, Chromium 156.0.8078.96: what the pinned `cef = "=156.6.0"` targets.
  CEF_VERSION: "156.0.30"
  CEF_BUILD: "cef_binary_156.0.30+g6028375+chromium-156.0.8078.96"
  CEF_HOST: "https://cef-builds.spotifycdn.com"

jobs:
  # The protocol, the stand-in and the GPUI app: no CEF. The headless smoke check runs the
  # stand-in through the real pipes and shared memory on each platform. The GPUI app is built,
  # not run (no display).
  standin:
    name: stand-in (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-26
          - name: linux
            os: ubuntu-26.04
          - name: windows
            os: windows-2025
    defaults:
      run:
        shell: bash
        working-directory: spikes/browser
    steps:
      - name: Keep line endings as committed
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          set -eu
          rustup toolchain install
          cargo --version
      - name: Install the Linux packages GPUI builds against
        if: runner.os == 'Linux'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libxcb1-dev libxkbcommon-x11-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Build (no CEF)
        run: cargo build --release --locked
      - name: Smoke check with the stand-in
        run: |
          set -eu
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          "target/release/spike-smoke$ext" --frames 60 --expect-marker -- "target/release/spike-standin$ext"

  # The CEF helper, with CEF downloaded on the runner.
  cef:
    name: cef helper (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-26
            platform: macosarm64
            folder: cef_macos_aarch64
            # SHA-256 of ${CEF_BUILD}_macosarm64_minimal.tar.bz2 (134,874,408 bytes).
            sha256: 731b599e78c71bf33530d65bfa18963f7d1d59902c1f381f5452188e5116b855
          - name: linux
            os: ubuntu-26.04
            platform: linux64
            folder: cef_linux_x86_64
            # SHA-256 of ${CEF_BUILD}_linux64_minimal.tar.bz2 (333,332,290 bytes).
            sha256: 356db99d653698aa9ba78b22965032b4fa5b23ba079ffdbaa5d28a8530f04011
          - name: windows
            os: windows-2025
            platform: windows64
            folder: cef_windows_x86_64
            # SHA-256 of ${CEF_BUILD}_windows64_minimal.tar.bz2 (175,176,258 bytes).
            sha256: 74fd321975e99703acd8fc7e3c1b0859292f61b388f4052a0cd7ef1fb3b29f6e
    env:
      CEF_PLATFORM: ${{ matrix.platform }}
      CEF_FOLDER: ${{ matrix.folder }}
      CEF_SHA256: ${{ matrix.sha256 }}
      CEF_DOWNLOAD_URL: "https://cef-download-disabled.example.com"
    defaults:
      run:
        shell: bash
        working-directory: spikes/browser
    steps:
      - name: Keep line endings as committed
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          set -eu
          rustup toolchain install
          cargo --version
          rustc --version
      # Windows: the bindings build CEF's C++ wrapper without shortening object file names
      # (CMAKE_OBJECT_PATH_MAX 500), and under the checkout's own target folder the longest
      # exceeded Windows' 260-character path limit (run 44129982414: every object path of 262
      # characters or more failed with C1083). A short target folder keeps them well under it;
      # the same arrangement on every platform keeps the steps alike.
      - name: Short build folder and runner facts
        run: |
          set -eu
          t="$RUNNER_TEMP/t"
          if [ "$RUNNER_OS" = "Windows" ]; then t="$(cygpath -m "$RUNNER_TEMP")/t"; fi
          echo "CARGO_TARGET_DIR=$t" >> "$GITHUB_ENV"
          echo "REL=$t/release" >> "$GITHUB_ENV"
          echo "build folder: $t (${#t} characters)"
          uname -a
          df -h "$RUNNER_TEMP"
          if [ "$RUNNER_OS" = "Windows" ]; then
            MSYS_NO_PATHCONV=1 reg query 'HKLM\SYSTEM\CurrentControlSet\Control\FileSystem' /v LongPathsEnabled \
              || echo "LongPathsEnabled: not set"
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            head -n 4 /etc/os-release
            echo "cores: $(nproc)"
            free -m
            for k in kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone \
                     user.max_user_namespaces; do
              printf '%s = %s\n' "$k" "$(sysctl -n "$k" 2>/dev/null || echo unavailable)"
            done
            echo "AppArmor enabled: $(cat /sys/module/apparmor/parameters/enabled 2>/dev/null || echo unknown)"
            echo "mount options of the temp folder: $(findmnt -no OPTIONS --target "$RUNNER_TEMP")"
            echo "mount options of /opt: $(findmnt -no OPTIONS --target /opt)"
          fi
      # Linux: the libraries libcef.so links against (installed one by one, so a name that
      # changed in this Ubuntu release is reported rather than failing the step; ldd below shows
      # what is still missing), a virtual display, and AppArmor's tools. No CMake: on Linux the
      # bindings link libcef.so directly and build no C++ wrapper (run 44129982414).
      - name: Install CEF's Linux libraries, a virtual display and AppArmor's tools
        if: runner.os == 'Linux'
        run: |
          set -u
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth apparmor
          for p in libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libgbm1 \
                   libpango-1.0-0 libcairo2 libxcomposite1 libxdamage1 libxrandr2 libxfixes3 libxext6 \
                   libxkbcommon0 libasound2t64 libdbus-1-3 libexpat1 libglib2.0-0t64 libx11-xcb1 \
                   libxshmfence1 libgtk-3-0t64; do
            sudo apt-get install -y --no-install-recommends "$p" >/dev/null 2>&1 || echo "package not installed: $p"
          done
      - name: Install CMake and Ninja (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eu
          command -v cmake || brew install cmake
          command -v ninja || brew install ninja
          cmake --version
          ninja --version
      - name: Download, verify and unpack the CEF distribution
        run: |
          set -eu
          dl="$RUNNER_TEMP/cef-download"
          mkdir -p "$dl"
          file="${CEF_BUILD}_${CEF_PLATFORM}_minimal.tar.bz2"
          url="$CEF_HOST/$(printf '%s' "$file" | sed 's/+/%2B/g')"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$dl/$file" "$url"
          if command -v sha256sum >/dev/null; then
            echo "$CEF_SHA256  $dl/$file" | sha256sum -c -
          else
            echo "$CEF_SHA256  $dl/$file" | shasum -a 256 -c -
          fi
          ls -l "$dl"
          ./unpack-cef.sh "$dl/$file" "$RUNNER_TEMP/cef" "$CEF_VERSION" "$CEF_FOLDER"
          echo "CEF_PATH=$RUNNER_TEMP/cef" >> "$GITHUB_ENV"
          echo "CEF_DIR=$RUNNER_TEMP/cef/$CEF_VERSION/$CEF_FOLDER" >> "$GITHUB_ENV"
      - name: Build the CEF helper and the smoke check
        id: build
        if: runner.os != 'Windows'
        run: |
          set -eu
          # On Linux the helper finds libcef.so beside itself (the next step places the runtime
          # files there), not through LD_LIBRARY_PATH, which the setuid sandbox drops.
          if [ "$RUNNER_OS" = "Linux" ]; then export RUSTFLAGS='-C link-arg=-Wl,-rpath,$ORIGIN'; fi
          cargo build --release --locked -p spike-cef-helper --features cef
          cargo build --release --locked -p spike-protocol
      # Windows: Chromium's sandbox needs CEF's bootstrap executable loading the client as a DLL
      # (CEF M138 and later). The helper is built as spike-cef-helper.dll (crate cef-helper-win,
      # exporting RunConsoleMain) and bootstrapc.exe from the distribution becomes
      # spike-cef-helper.exe. Ninja with MSVC needs the compiler's environment from vcvars64.bat.
      - name: Build the CEF helper DLL and the smoke check (Windows)
        id: build-windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          where cl
          cmake --version
          ninja --version
          echo build folder: %CARGO_TARGET_DIR%
          cargo build --release --locked -p spike-cef-helper-win || exit /b 1
          cargo build --release --locked -p spike-protocol || exit /b 1
      # The bindings' build script copies CEF's runtime files to the folder three levels above
      # its OUT_DIR, which with this cargo's build-script layout (build/<package>/<hash>/out) is
      # release/build rather than release, where the helper is. They are copied beside the
      # helper here, from the unpacked distribution, leaving out the build-only files.
      - name: Place CEF's runtime files beside the helper (Linux and Windows)
        if: runner.os != 'macOS'
        run: |
          set -eu
          ls -d "$REL"/build/libcef.* 2>/dev/null || echo "no libcef file in $REL/build"
          for f in "$CEF_DIR"/*; do
            case "$(basename "$f")" in
              cmake|include|libcef_dll|CMakeLists.txt|archive.json) ;;
              *) cp -R "$f" "$REL/" ;;
            esac
          done
          ls -la "$REL"
      - name: Arrange the bootstrap and the helper DLL (Windows)
        if: runner.os == 'Windows'
        run: |
          set -eu
          echo "files in the CEF distribution's Release folder:"
          ls -la "$CEF_DIR"
          cp "$CEF_DIR/bootstrapc.exe" "$REL/spike-cef-helper.exe"
          cp "$REL/spike_cef_helper_win.dll" "$REL/spike-cef-helper.dll"
          ls -l "$REL/spike-cef-helper.exe" "$REL/spike-cef-helper.dll" "$REL/libcef.dll"
      - name: Sizes of the CEF component
        run: |
          set -eu
          du -sh "$RUNNER_TEMP/cef-download"/*.tar.bz2
          du -sh "$CEF_DIR"
          if [ "$RUNNER_OS" = "Linux" ]; then
            ldd "$REL/libcef.so" | grep 'not found' || echo "libcef.so: every library found"
            ldd "$REL/spike-cef-helper" | grep -E 'libcef|not found' || echo "spike-cef-helper: no libcef line"
          fi
      - name: Bundle and smoke-check the CEF helper (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eu
          cef-helper/bundle-macos.sh "$CEF_DIR" "$REL"
          log="$RUNNER_TEMP/smoke-macos.log"
          profile="$RUNNER_TEMP/cef-profile"
          "$REL/spike-smoke" --frames 1 --timeout-s 90 --hold-s 8 --expect-sandbox -- \
            "$REL/spike-cef-helper.app/Contents/MacOS/spike-cef-helper" \
            --profile-dir "$profile" >"$log" 2>&1 &
          smoke=$!
          sockets=0
          ./ci-while-holding.sh "$log" macos || sockets=$?
          status=0
          wait "$smoke" || status=$?
          cat "$log"
          echo "--- CEF log, last 80 lines ---"
          if [ -f "$profile/cef.log" ]; then tail -n 80 "$profile/cef.log"; else echo "(no CEF log)"; fi
          echo "smoke exit status: $status; socket check: $sockets"
          [ "$status" -eq 0 ] && [ "$sockets" -eq 0 ]
      # Linux, run 1: the build folder as a tarball would install it. chrome-sandbox is there but
      # not setuid root, and no AppArmor profile is installed, so Chromium needs unprivileged user
      # namespaces, which Ubuntu restricts with AppArmor since 23.10. Chromium refuses to start
      # without a sandbox rather than run unsandboxed. This step records what happens and does
      # not fail the job: a failure here is the expected finding for a tarball install, shown as
      # a warning annotation and in the step summary.
      - name: Linux, tarball-style run (no setuid helper, no AppArmor profile)
        if: runner.os == 'Linux' && steps.build.outcome == 'success'
        run: |
          set -u
          ls -l "$REL/chrome-sandbox"
          status=0
          ./ci-linux-run.sh tarball "$REL" "$RUNNER_TEMP/cef-profile-tar" || status=$?
          if [ "$status" -eq 0 ]; then
            msg="passed: Chromium ran sandboxed without a setuid helper or a profile (the runner allows unprivileged user namespaces)"
          else
            msg="failed with status $status: a tarball install gets no usable sandbox on this runner (see the log for Chromium's message)"
          fi
          printf '\n::warning title=Linux tarball-style run::%s\n' "$msg"
          printf -- '- Linux tarball-style run: %s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      # Linux, run 2: the same files installed as a .deb, which ships chrome-sandbox owned by
      # root with the setuid bit (the first documented way). The smoke check requires every
      # process the sandbox rule names to run with a seccomp-bpf filter.
      - name: Linux, .deb install with the setuid sandbox helper
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.build.outcome == 'success' }}
        run: |
          set -eu
          stage="$RUNNER_TEMP/deb"
          opt="$stage/opt/unidex-browser-trial"
          mkdir -p "$opt" "$stage/DEBIAN"
          cp "$REL/spike-cef-helper" "$REL/spike-smoke" "$opt/"
          for f in "$CEF_DIR"/*; do
            case "$(basename "$f")" in
              cmake|include|libcef_dll|CMakeLists.txt|archive.json) ;;
              *) cp -R "$f" "$opt/" ;;
            esac
          done
          chmod 4755 "$opt/chrome-sandbox"
          printf '%s\n' "Package: unidex-browser-trial" "Version: 0.0.0" "Architecture: amd64" \
            "Maintainer: trial <trial@example.com>" "Description: Task 12 browser trial" > "$stage/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$stage" "$RUNNER_TEMP/trial.deb"
          sudo dpkg -i "$RUNNER_TEMP/trial.deb"
          ls -l /opt/unidex-browser-trial/chrome-sandbox
          du -sh /opt/unidex-browser-trial
          ./ci-linux-run.sh deb /opt/unidex-browser-trial "$RUNNER_TEMP/cef-profile-deb"
      # Linux, run 3: no setuid helper; instead an AppArmor profile lets the helper create user
      # namespaces, so Chromium uses its namespace sandbox (the second documented way, from
      # Chromium's AppArmor user-namespace document). The profile names the exact path of a copy
      # of the build without chrome-sandbox.
      - name: Linux, AppArmor profile for the helper (no setuid helper)
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.build.outcome == 'success' }}
        run: |
          set -eu
          aa="$RUNNER_TEMP/aa"
          mkdir -p "$aa"
          cp "$REL/spike-cef-helper" "$REL/spike-smoke" "$aa/"
          for f in "$CEF_DIR"/*; do
            case "$(basename "$f")" in
              cmake|include|libcef_dll|CMakeLists.txt|archive.json|chrome-sandbox) ;;
              *) cp -R "$f" "$aa/" ;;
            esac
          done
          helper="$(realpath "$aa/spike-cef-helper")"
          printf '%s\n' "abi <abi/4.0>," "include <tunables/global>" "" \
            "profile unidex-browser-trial \"$helper\" flags=(unconfined) {" "  userns," "}" > "$RUNNER_TEMP/aa.profile"
          cat "$RUNNER_TEMP/aa.profile"
          sudo install -m 0644 -o root -g root "$RUNNER_TEMP/aa.profile" /etc/apparmor.d/unidex-browser-trial
          sudo apparmor_parser -r /etc/apparmor.d/unidex-browser-trial
          sudo aa-status > "$RUNNER_TEMP/aa-status.txt" 2>&1 || echo "aa-status exited $?"
          grep -n 'unidex-browser-trial' "$RUNNER_TEMP/aa-status.txt" || echo "the profile is not listed by aa-status"
          ./ci-linux-run.sh apparmor "$aa" "$RUNNER_TEMP/cef-profile-aa"
      # The process tree is read on Windows by ci-windows-tree.ps1 (integrity level, restricted
      # token, AppContainer, job) while the smoke check holds the helper; it writes a verdict for
      # the renderers. CEF's log would report a sandbox failure.
      - name: Smoke-check the helper under the bootstrap (Windows)
        if: runner.os == 'Windows'
        run: |
          set -u
          log="$RUNNER_TEMP/smoke-windows.log"
          profile="$(cygpath -m "$RUNNER_TEMP")/cef-profile"
          "$REL/spike-smoke.exe" --frames 1 --timeout-s 90 --hold-s 10 -- \
            "$REL/spike-cef-helper.exe" --profile-dir "$profile" >"$log" 2>&1 &
          smoke=$!
          sockets=0
          ./ci-while-holding.sh "$log" windows || sockets=$?
          status=0
          wait "$smoke" || status=$?
          cat "$log"
          echo "--- CEF log, last 80 lines ---"
          if [ -f "$profile/cef.log" ]; then tail -n 80 "$profile/cef.log"; else echo "(no CEF log)"; fi
          verdict="not written (the smoke check never reached its hold)"
          if [ -f "$RUNNER_TEMP/windows-sandbox-verdict.txt" ]; then
            verdict="$(tr -d '\r' < "$RUNNER_TEMP/windows-sandbox-verdict.txt")"
          fi
          printf '\n::warning title=Windows sandbox per process::%s\n' "$verdict"
          printf -- '- Windows sandbox per process: %s\n' "$verdict" >> "$GITHUB_STEP_SUMMARY"
          echo "smoke exit status: $status; socket check: $sockets; sandbox: $verdict"
          [ "$status" -eq 0 ] && [ "$sockets" -eq 0 ] && [ "${verdict%%:*}" = "ok" ]
