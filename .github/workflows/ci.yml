name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pull request runs share a group per ref, so a newer push cancels the older
  # run. Every push to main gets a group of its own (its run id), so it is
  # never pended or cancelled and its commit range is always scanned.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

# Build caching (decision 0007): the jobs that compile GPUI (lint and test)
# restore the cargo registry and `target/` with actions/cache/restore. Only a
# push to main saves a cache, with actions/cache/save, so a pull request can
# use main's cache but never write one (no poisoning from a pull request, and
# pull requests do not crowd main's caches out of the repository's quota).
# The key is the job, the platform, the toolchain file and Cargo.lock; a
# lockfile change falls back to the newest cache of the same job, platform
# and toolchain. A toolchain change starts cold.
#
# Linux: GPUI's build scripts and links need these packages (decision 0007):
#   pkg-config, libfontconfig-dev (fontconfig and freetype), libxcb1-dev
#   (x11rb links libxcb), libxkbcommon-x11-dev (xkbcommon and xkbcommon-x11).
# Versions are the runner image's; apt packages are not pinned.
#
# Runner labels are fixed (never -latest). Source: the runner-images README
# (github.com/actions/runner-images), general-availability table:
#   ubuntu-26.04 (Ubuntu LTS), macos-26 (Apple silicon), windows-2025.

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        shell: bash
        run: |
          set -eu
          rustup toolchain install
          cargo --version
      - name: Install the Linux packages GPUI builds against
        shell: bash
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libxcb1-dev libxkbcommon-x11-dev
      - name: Restore the build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: lint-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            lint-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Save the build cache
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-26
          - name: linux
            os: ubuntu-26.04
          - name: windows
            os: windows-2025
    steps:
      # Before checkout, so line endings never change file contents.
      - name: Keep line endings as committed
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        shell: bash
        run: |
          set -eu
          rustup toolchain install
          cargo --version
      - name: Install the Linux packages GPUI builds against
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libxcb1-dev libxkbcommon-x11-dev
      - name: Restore the build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: test-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            test-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Test
        shell: bash
        run: cargo test --workspace --locked
      # Check that every target, the cookbook examples included, builds. The
      # test step builds the examples already; `--all-targets` resolves
      # features as it did (test targets and dev-dependencies included), so
      # this is a check, not a rebuild. `--examples` (and `-p udx-cookbook`
      # before it) resolved them differently and recompiled the platform
      # crates: measured locally on macOS after `cargo test --workspace
      # --no-run`, `--examples` compiled 15 units in 6 s (rustix, tempfile,
      # the toml crates, cbindgen, gpui-pre-apple, gpui-pre-macos,
      # gpui-pre-platform, udx-cookbook) and `--all-targets` none.
      - name: Build the cookbook examples
        shell: bash
        run: cargo build --workspace --all-targets --locked
      - name: Save the build cache
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

  deny:
    name: deny
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        shell: bash
        run: |
          set -eu
          rustup toolchain install
          cargo --version
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.21.0
      - name: Check licences, bans, advisories and sources
        run: cargo deny --locked check

  audit:
    name: audit
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        shell: bash
        run: |
          set -eu
          rustup toolchain install
          cargo --version
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit@0.23.0
      - name: Audit the lockfile
        run: cargo audit

  # Mutation testing of udx-core and xtask, in shards. One job ran it all and
  # no longer fits its limit (Task 1a's run was cancelled at 30 minutes), so
  # the mutants are split across MUTANTS_SHARDS jobs with cargo-mutants' own
  # sharding. The job named `mutants` (the required check) passes only when
  # every shard passed, or when the decide job found that the diff does not
  # touch the mutated crates and the shards were skipped for that reason.
  mutants-decide:
    name: mutants (decide)
    # Pull requests only, as before.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      BASE_REF: ${{ github.base_ref }}
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the diff touches the mutated crates
        id: changed
        shell: bash
        run: |
          set -eu
          # Exit code 0: untouched. 1: touched. Anything else is an error.
          rc=0
          git diff --quiet "origin/${BASE_REF}...HEAD" -- crates/udx-core xtask || rc=$?
          case "$rc" in
            0) run=false ;;
            1) run=true ;;
            *) echo "git diff failed with exit code ${rc}" >&2; exit "$rc" ;;
          esac
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "touches udx-core or xtask: ${run}"

  mutants-shard:
    name: mutants shard (${{ matrix.shard }}/8)
    needs: mutants-decide
    if: needs.mutants-decide.outputs.run == 'true'
    runs-on: ubuntu-26.04
    # Eight shards, by a local measurement with 2 jobs per shard, as here:
    # the unsharded 679 mutants took 63 minutes as eight
    # shards of 84 or 85, the slowest shard 9 minutes (539 s, including two
    # mutants that run to the per-mutant timeout of five times the baseline
    # test time). A hosted runner taken as three times slower: 27 minutes,
    # plus about 6 for the toolchain and the cargo-mutants install, 33. The
    # limit of 50 leaves half again as much. With fewer shards a slow runner
    # would come close to the limit; more would mostly add runner start-up.
    # Changing the count means changing the matrix, MUTANTS_SHARDS and the
    # name together.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        # Shown as 1 to 8; cargo-mutants numbers shards from 0 (`--shard k/n`
        # needs k < n), so the step passes shard - 1.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      SHARD: ${{ matrix.shard }}
      MUTANTS_SHARDS: "8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        shell: bash
        run: |
          set -eu
          rustup toolchain install
          cargo --version
      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants@27.1.0
      - name: Mutation tests (one shard)
        shell: bash
        run: |
          set -eu
          # Round-robin puts mutant i on shard i % n, so the slow mutants
          # (the loop-advance ones that run to the per-mutant timeout, which
          # sit next to each other in rules.rs) spread across the shards.
          # The shards together are exactly the unsharded list.
          index=$((SHARD - 1))
          # The result is decided from the report files, not only the exit
          # code. Exit 3 means at least one mutant timed out (a hang counts
          # as detected) and can also hide missed mutants, because cargo-mutants
          # checks timeouts before misses; that is why missed.txt is read.
          rc=0
          cargo mutants -p udx-core -p xtask --no-shuffle -j 2 \
            --shard "${index}/${MUTANTS_SHARDS}" --sharding round-robin || rc=$?
          if [ -s mutants.out/missed.txt ]; then
            echo "Missed mutants:"
            cat mutants.out/missed.txt
            echo "::error::$(wc -l < mutants.out/missed.txt | tr -d ' ') mutant(s) missed"
            exit 2
          fi
          case "$rc" in
            0|3)
              if [ ! -d mutants.out ]; then
                echo "::error::cargo mutants exited ${rc} but wrote no mutants.out" >&2
                exit 1
              fi
              if [ "$rc" = 3 ]; then
                n=0
                if [ -f mutants.out/timeout.txt ]; then
                  echo "Mutants that timed out:"
                  cat mutants.out/timeout.txt
                  n="$(wc -l < mutants.out/timeout.txt | tr -d ' ')"
                fi
                echo "::warning::${n} mutant(s) timed out; listed above"
              fi
              ;;
            *) echo "cargo mutants failed with exit code ${rc}" >&2; exit "$rc" ;;
          esac

  mutants:
    name: mutants
    # Pull requests only. It always runs on a pull request so the required
    # check reports, and decides from the other two jobs' results.
    needs: [mutants-decide, mutants-shard]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Decide from the decide job and the shards
        shell: bash
        env:
          DECIDE_RESULT: ${{ needs.mutants-decide.result }}
          RUN: ${{ needs.mutants-decide.outputs.run }}
          SHARDS_RESULT: ${{ needs.mutants-shard.result }}
        run: |
          set -eu
          # Pass only when every shard passed, or when the diff does not touch
          # the mutated crates and the shards were skipped for that reason.
          # Anything else (a failed or cancelled decide job or shard, or shards
          # that did not run although they had to) fails.
          echo "decide: ${DECIDE_RESULT}, touches the crates: ${RUN:-unknown}, shards: ${SHARDS_RESULT}"
          if [ "${DECIDE_RESULT}" != success ]; then
            echo "::error::the decide job did not succeed (${DECIDE_RESULT})"
            exit 1
          fi
          case "${RUN}:${SHARDS_RESULT}" in
            true:success) echo "every shard passed" ;;
            false:skipped) echo "the diff does not touch udx-core or xtask; nothing to mutate" ;;
            *) echo "::error::mutation shards: ${SHARDS_RESULT} (touches the crates: ${RUN:-unknown})"; exit 1 ;;
          esac

  privacy:
    name: privacy
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      EVENT_NAME: ${{ github.event_name }}
      BASE_REF: ${{ github.base_ref }}
      PUSH_BEFORE: ${{ github.event.before }}
      HEAD_SHA: ${{ github.sha }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the checksums file
      # published with the v8.30.1 release.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned toolchain
        shell: bash
        run: |
          set -eu
          rustup toolchain install
          cargo --version
      - name: Install gitleaks
        shell: bash
        run: |
          set -eu
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          echo "${RUNNER_TEMP}/gitleaks" >> "$GITHUB_PATH"
      - name: Privacy scan of the whole tree
        shell: bash
        env:
          CI: "1"
        run: cargo xtask privacy --all
      - name: Work out the commit range
        id: range
        shell: bash
        run: |
          set -eu
          range=""
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            # The pull request head, not the merge ref: GitHub's synthetic
            # merge commit is not the author's work. It is the second parent
            # of the merge commit, so its objects are present.
            range="origin/${BASE_REF}..${PR_HEAD}"
          elif [ "${EVENT_NAME}" = "push" ]; then
            # An all-zero "before" (new branch) has no range to scan.
            case "${PUSH_BEFORE}" in
              ""|*[!0]*) [ -n "${PUSH_BEFORE}" ] && range="${PUSH_BEFORE}..${HEAD_SHA}" ;;
            esac
          fi
          echo "range=${range}" >> "$GITHUB_OUTPUT"
          echo "commit range: ${range:-none}"
      - name: Privacy scan of the commit range
        if: steps.range.outputs.range != ''
        shell: bash
        env:
          CI: "1"
          RANGE: ${{ steps.range.outputs.range }}
        run: cargo xtask privacy --range "${RANGE}"
      - name: Secret scan of the commit range
        if: ${{ !cancelled() && steps.range.outputs.range != '' }}
        shell: bash
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          # As in privacy-base.yml: no inline allow comment is honoured, and
          # every file (merge resolutions included) is read as text.
          gitleaks git --no-banner --redact --ignore-gitleaks-allow --config .gitleaks.toml \
            --log-opts="--text --diff-merges=first-parent ${RANGE}" .
      - name: Flag changes to files that govern the checks
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -eu
          # One annotation per group. `git diff --quiet` exits 0 when
          # untouched and 1 when touched; anything else is an error.
          flag() {
            label="$1"
            shift
            rc=0
            git diff --quiet "origin/${BASE_REF}...HEAD" -- "$@" || rc=$?
            case "$rc" in
              0) ;;
              1) echo "::warning::This pull request changes ${label}. Review it closely: it can weaken the checks." ;;
              *) echo "git diff failed with exit code ${rc}" >&2; exit "$rc" ;;
            esac
          }
          flag "privacy-allow.toml (review every new exemption)" privacy-allow.toml
          flag ".gitleaks.toml" .gitleaks.toml
          flag "xtask/src/privacy/" xtask/src/privacy
          flag ".github/workflows/" .github/workflows
          flag "deny.toml" deny.toml
          flag ".cargo/mutants.toml" .cargo/mutants.toml
          flag "xtask/src/hooks.rs" xtask/src/hooks.rs
          flag ".cargo/config.toml" .cargo/config.toml
          flag "crates/udx-core/src/paths.rs" crates/udx-core/src/paths.rs
