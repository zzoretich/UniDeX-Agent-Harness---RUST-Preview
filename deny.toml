# cargo-deny policy: licences, advisories, bans and sources.

[graph]
all-features = true

[licenses]
# Check dev-dependencies too: the cookbook takes GPUI as one, and without this its whole tree skips the licence check.
include-dev = true
# Everything not listed here is denied.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # Allowed by the maintainer on 2026-11-17 (decision 0007): it sets no conditions at all.
    "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities are always errors in advisories version 2.
#
# Decided by the maintainer on 2026-11-17 (decision 0007): an "unmaintained" notice fails the check only for a crate
# this workspace depends on directly. Notices deeper in a dependency's tree (GPUI's, for example) do not fail it;
# `cargo audit` prints them as warnings (cargo-deny does not print out-of-scope notices at all), and they are
# reviewed at every GPUI upgrade. Vulnerabilities, unsound notices and yanked crates fail everywhere.
unmaintained = "workspace"
# The default scope for unsound notices is "workspace"; "all" makes them fail for the whole dependency tree.
unsound = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
