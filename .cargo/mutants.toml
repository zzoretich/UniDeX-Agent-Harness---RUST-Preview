# A mutant that makes the test suite run several times longer than the
# unmutated baseline is a hang (an endless loop), so it times out quickly
# instead of after the 300 second default. The baseline suite takes a few
# seconds; the floor covers a slow or cold CI runner.
timeout_multiplier = 5
minimum_test_timeout = 30

# Each exclusion is an equivalent mutant: it changes no observable behaviour.
exclude_re = [
    # `lines[at + 1..]` -> `lines[at * 1..]`: the search then starts on the
    # scissors line itself, which always begins with the token the search
    # skips, so the first line it accepts is the same one.
    "replace \\+ with \\* in clean_git_message",
    # `Terms::generic()` is `Terms::default()` already, so returning
    # `Default::default()` is the same value.
    "replace Terms::generic -> Terms with Default::default\\(\\)",
]
