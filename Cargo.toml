[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

# GPUI, pinned to one upstream snapshot (decision 0007). A crate that draws UI copies
# `gpui.workspace = true` and `gpui_platform.workspace = true`; only an upgrade changes these lines.
[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
