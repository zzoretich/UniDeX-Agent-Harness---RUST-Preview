[package]
name = "chat-term-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chat-term-core = { path = "../core" }
alacritty_terminal = "=0.26.0" # Apache-2.0
gpui.workspace = true
gpui_platform.workspace = true
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "time"] } # MIT
serde_json = "=1.0.154" # MIT OR Apache-2.0
# The widget kit's unstyled layer, for its markdown TextView (renderer `kit`). Optional: off unless `--features kit`.
gpui-base = { version = "=0.10.0", optional = true } # Apache-2.0

[features]
# GPUI's frame profiler: per-frame layout, prepaint, paint and present times. Off for the headline numbers.
profiler = ["gpui/profiler"]
# The widget kit's markdown view as a second renderer for the chat (`--renderer kit`).
kit = ["dep:gpui-base"]
