[package]
name = "chat-term-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Every dependency is pinned exactly; licences are noted beside each one.
[dependencies]
alacritty_terminal = "=0.26.0" # Apache-2.0
portable-pty = "=0.9.0" # MIT
pulldown-cmark = { version = "=0.13.6", default-features = false } # MIT
serde_json = "=1.0.154" # MIT OR Apache-2.0

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191" # MIT OR Apache-2.0

# The version alacritty_terminal already uses; only for the headless check's child helper (console size, raw input).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_System_Console"] } # MIT OR Apache-2.0

[[bin]]
name = "headless-check"
path = "src/bin/headless_check.rs"
