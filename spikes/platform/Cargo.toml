# Task 11 trial: how the pinned GPUI snapshot integrates with each operating system (text entry with input methods
# and dead keys, a tray icon with a popover, the application menu, a second window, open and save dialogs, a custom
# link scheme, and screen-reader access). Throwaway code. This is its own workspace, NOT a member of the repository's
# workspace, and it has its own Cargo.lock. See docs/decisions/0010-platform-integration-trial.md,
# docs/decisions/0011-tray-crate.md and CHECKLIST.md in this folder.
#
# Every dependency is pinned exactly. Licences (checked against deny.toml's allow list):
#   gpui-pre, gpui-pre-platform 0.3.12     Apache-2.0 (decision 0007)
#   tray-icon 0.26.1                       MIT OR Apache-2.0 (Tauri); brings muda 0.21.2, MIT OR Apache-2.0
#   async-channel 2.5.0                    MIT OR Apache-2.0 (already in GPUI's tree)
#   raw-window-handle 0.6.2                MIT OR Apache-2.0 OR Zlib (already in GPUI's tree)
#   objc2 0.6.5, objc2-foundation 0.3.2,   Zlib OR Apache-2.0 OR MIT (macOS only; already in GPUI's tree)
#   objc2-app-kit 0.3.2
#   windows-sys 0.61.2                     MIT OR Apache-2.0 (Windows only; already in GPUI's tree)
#   gtk 0.18.2                             MIT (Linux, AppIndicator backend only); links the system GTK 3, LGPL
#
# Linux tray backends (tray-icon features), chosen here with this crate's features:
#   tray-appindicator (default)  GTK 3 + libayatana-appindicator3 or libappindicator3 (system libraries, LGPL),
#                                loaded at run time; a GTK main loop on its own thread.
#   tray-ksni                    pure Rust StatusNotifierItem over D-Bus (ksni 0.3.7, licence Unlicense, which is
#                                NOT on deny.toml's allow list); no GTK.

[package]
name = "platform-trial"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[features]
default = ["tray-appindicator"]
tray-appindicator = ["tray-icon/libappindicator", "dep:gtk"]
tray-ksni = ["tray-icon/ksni"]

[dependencies]
# Copied exactly from the repository's root Cargo.toml (decision 0007).
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
tray-icon = { version = "=0.26.1", default-features = false }
async-channel = "=2.5.0"
raw-window-handle = "=0.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSRange", "NSGeometry", "NSObject"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSEvent", "NSView", "NSWindow", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSGraphicsContext", "NSScreen"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "=0.18.2", optional = true }

[dev-dependencies]
# The same snapshot with GPUI's headless test platform, for `cargo test` on every runner.
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }

[profile.release]
debug = "line-tables-only"
