# Trial only (Task 14): the same package as ../../packaging/Packager.toml plus one file that must end up setuid root
# (mode 4755), the way the embedded browser's sandbox helper will. The workflow creates the source file with that
# mode and then reads the mode back from the finished .deb. Delete with the spike.
name = "unidex-rust-preview"
productName = "UniDeX Rust Preview"
version = "0.0.1"
identifier = "example.unidex.rust-preview.trial"
description = "Trial build of the UniDeX Rust Preview cookbook window (setuid probe)"
publisher = "UniDeX contributors"
authors = ["UniDeX contributors"]
binariesDir = "../../target/packaging/bin"
outDir = "../../target/packaging/out-setuid"
binaries = [{ path = "unidex-rust-preview", main = true }]

[deb]
packageName = "unidex-rust-preview"
depends = ["libc6"]

[deb.files]
"../../target/packaging/setuid-probe/helper" = "usr/lib/unidex-rust-preview/helper"
