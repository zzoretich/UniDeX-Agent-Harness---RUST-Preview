# Task 14 packaging trial: a placeholder program for the candidates that can only package a Cargo binary target
# (cargo-dist) or that read their settings from a manifest (cargo-deb). The real program, the cookbook window, is an
# example target of the workspace crate udx-cookbook, which cargo-dist cannot package; the trial shows what each tool
# does with a binary target. Throwaway: its own workspace, no dependencies, deleted with the spike.
# The repository URL is a reserved placeholder: a real one would name an account.

[package]
name = "unidex-packaging-probe"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false
description = "Placeholder program for the packaging trial"
repository = "https://example.com/unidex-packaging-probe"

[workspace]

[[bin]]
name = "unidex-packaging-probe"
path = "src/main.rs"

[package.metadata.deb]
name = "unidex-rust-preview"
maintainer = "UniDeX contributors"
copyright = "UniDeX contributors"
section = "devel"
priority = "optional"
depends = "libc6"
extended-description = "Trial package built by cargo-deb."
maintainer-scripts = "debian"
assets = [
  { source = "../../../target/packaging/bin/unidex-rust-preview", dest = "usr/bin/unidex-rust-preview", mode = "755" },
  { source = "../../../target/packaging/setuid-probe/helper", dest = "usr/lib/unidex-rust-preview/helper", mode = "4755" },
]

[package.metadata.wix]
upgrade-guid = "5F6E4D3C-2B1A-4F0E-9D8C-7B6A5F4E3D2C"
path-guid = "A1B2C3D4-E5F6-4A7B-8C9D-0E1F2A3B4C5D"
license = false
eula = false
