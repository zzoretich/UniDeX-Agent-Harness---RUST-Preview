[package]
name = "spike-cef-helper-win"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Windows only: the CEF helper as the DLL that CEF's bootstrap executable loads. Since CEF M138
# Chromium's sandbox on Windows needs the client built as a DLL and started by `bootstrapc.exe`
# (console) or `bootstrap.exe` (windows), renamed to the client's name; the bootstrap sets up the
# sandbox and calls the DLL's `RunConsoleMain` with the sandbox information. The workflow copies
# `bootstrapc.exe` to `spike-cef-helper.exe` and this DLL to `spike-cef-helper.dll`.

[lib]
name = "spike_cef_helper_win"
path = "src/lib.rs"
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
spike-cef-helper = { path = "../cef-helper", features = ["cef"] }
