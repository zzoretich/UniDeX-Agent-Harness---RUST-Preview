<!doctype html>
<!-- Browser trial test page: input forwarding. Positions are fixed (logical pixels) because the
     trial's scripted scenario clicks at known coordinates; keep them in step with app/src/script.rs. -->
<html>
<head>
<meta charset="utf-8">
<title>trial form</title>
<style>
  body { margin: 0; font: 16px -apple-system, Helvetica, sans-serif; background: #fff; color: #111; }
  .abs { position: absolute; box-sizing: border-box; }
  input, textarea, select { font: 20px -apple-system, Helvetica, sans-serif; }
  /* The latency field: no caret, so the only change in its box is the typed glyph. */
  #lat { left: 20px; top: 20px; width: 400px; height: 40px; caret-color: transparent; outline: none; border: 1px solid #888; }
  #name { left: 20px; top: 80px; width: 400px; height: 40px; }
  #other { left: 440px; top: 80px; width: 300px; height: 40px; }
  #area { left: 20px; top: 140px; width: 400px; height: 90px; }
  #ime { left: 440px; top: 140px; width: 300px; height: 40px; }
  #pick { left: 20px; top: 250px; width: 200px; height: 36px; }
  #link { left: 240px; top: 250px; width: 160px; height: 36px; line-height: 36px; }
  #buttons { left: 20px; top: 300px; width: 760px; }
  #buttons button { font: 14px -apple-system, Helvetica, sans-serif; height: 32px; margin: 0 8px 8px 0; }
  /* One device pixel per cell at any scale: drawn by script to match devicePixelRatio. */
  #checker { left: 440px; top: 200px; width: 64px; height: 32px; }
  #status { left: 20px; top: 400px; width: 760px; height: 60px; font: 12px monospace; }
</style>
</head>
<body>
<input id="lat" class="abs" autocomplete="off">
<input id="name" class="abs" autocomplete="off">
<input id="other" class="abs" autocomplete="off">
<textarea id="area" class="abs"></textarea>
<input id="ime" class="abs" autocomplete="off">
<select id="pick" class="abs">
  <option value="one">one</option>
  <option value="two">two</option>
  <option value="three">three</option>
</select>
<a id="link" class="abs" href="#clicked">a link</a>
<div id="buttons" class="abs">
  <button id="b-download">download</button>
  <button id="b-file">file chooser</button>
  <button id="b-popup">window.open</button>
  <button id="b-geo">geolocation</button>
  <button id="b-media">camera</button>
  <button id="b-alert">alert</button>
  <input id="file" type="file" style="display:none">
  <a id="dl" href="data:text/plain,trial" download="trial.txt" style="display:none">dl</a>
</div>
<canvas id="checker" class="abs"></canvas>
<div id="status" class="abs"></div>
<script>
  window.__log = [];
  const log = (e) => { window.__log.push(e); document.getElementById('status').textContent = window.__log.slice(-6).join(' '); };
  for (const id of ['lat', 'name', 'other', 'area', 'ime', 'pick']) {
    const el = document.getElementById(id);
    el.addEventListener('focus', () => log('focus:' + id));
    el.addEventListener('blur', () => log('blur:' + id));
    el.addEventListener('keydown', (e) => log('keydown:' + id + ':' + e.key + (e.metaKey ? '+meta' : '')));
    el.addEventListener('compositionstart', (e) => log('compositionstart:' + id));
    el.addEventListener('compositionupdate', (e) => log('compositionupdate:' + id + ':' + e.data));
    el.addEventListener('compositionend', (e) => log('compositionend:' + id + ':' + e.data));
    el.addEventListener('change', () => log('change:' + id + ':' + el.value));
  }
  window.addEventListener('focus', () => log('window-focus'));
  window.addEventListener('blur', () => log('window-blur'));
  document.addEventListener('mousedown', (e) => log('mousedown:' + e.button + '@' + e.clientX + ',' + e.clientY));
  window.addEventListener('wheel', (e) => log('wheel:' + Math.round(e.deltaY)), { passive: true });
  document.getElementById('link').addEventListener('click', () => log('link-click'));
  document.getElementById('b-download').onclick = () => document.getElementById('dl').click();
  document.getElementById('b-file').onclick = () => document.getElementById('file').click();
  document.getElementById('b-popup').onclick = () => log('open:' + String(window.open('about:blank', '_blank')));
  document.getElementById('b-geo').onclick = () => navigator.geolocation.getCurrentPosition(
    () => log('geo:allowed'), (e) => log('geo:denied:' + e.code));
  document.getElementById('b-media').onclick = () => navigator.mediaDevices.getUserMedia({ video: true })
    .then(() => log('media:allowed'), (e) => log('media:denied:' + e.name));
  document.getElementById('b-alert').onclick = () => { alert('trial'); log('alert:returned'); };
  function drawChecker() {
    const c = document.getElementById('checker');
    const r = window.devicePixelRatio;
    c.width = Math.round(64 * r); c.height = Math.round(32 * r);
    const g = c.getContext('2d');
    const img = g.createImageData(c.width, c.height);
    for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
      const v = ((x + y) & 1) ? 255 : 0, i = (y * c.width + x) * 4;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  }
  drawChecker();
  matchMedia('(resolution: ' + window.devicePixelRatio + 'dppx)').addEventListener('change', drawChecker);
  window.addEventListener('resize', () => { log('resize:' + innerWidth + 'x' + innerHeight + '@' + devicePixelRatio); drawChecker(); });
</script>
</body>
</html>
