<!doctype html>
<!-- Browser trial test page: a continuous animation (a CSS transform and a canvas redrawn on
     every requestAnimationFrame), so the engine produces a frame every display refresh. -->
<html>
<head>
<meta charset="utf-8">
<title>trial animation</title>
<style>
  body { margin: 0; background: #0f172a; color: #e2e8f0; font: 16px -apple-system, Helvetica, sans-serif; overflow: hidden; }
  .box { position: absolute; top: 120px; left: 40px; width: 120px; height: 120px; border-radius: 16px;
         background: linear-gradient(135deg, #f59e0b, #ef4444); animation: slide 2s ease-in-out infinite alternate; }
  @keyframes slide { from { transform: translateX(0) rotate(0); } to { transform: translateX(900px) rotate(180deg); } }
  canvas { position: absolute; left: 40px; top: 300px; }
  #fps { position: absolute; left: 40px; top: 40px; font: 20px monospace; }
</style>
</head>
<body>
<div id="fps">starting</div>
<div class="box"></div>
<canvas id="c" width="1000" height="400"></canvas>
<script>
  const c = document.getElementById('c'), g = c.getContext('2d');
  let frames = 0, last = performance.now(), shown = 0;
  window.__frames = 0;
  function draw(t) {
    frames++; window.__frames++;
    g.fillStyle = '#0f172a'; g.fillRect(0, 0, c.width, c.height);
    for (let i = 0; i < 24; i++) {
      const x = 500 + Math.cos(t / 600 + i) * (120 + i * 12), y = 200 + Math.sin(t / 500 + i * 0.7) * 150;
      g.fillStyle = 'hsl(' + ((i * 15 + t / 20) % 360) + ',80%,60%)';
      g.beginPath(); g.arc(x, y, 14, 0, Math.PI * 2); g.fill();
    }
    if (t - last > 1000) { shown = Math.round(frames * 1000 / (t - last)); frames = 0; last = t;
      document.getElementById('fps').textContent = 'page rAF ' + shown + ' fps'; }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
</body>
</html>
