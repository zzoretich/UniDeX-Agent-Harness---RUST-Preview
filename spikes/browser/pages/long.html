<!doctype html>
<!-- Browser trial test page: a long page to scroll (generated text and coloured blocks). -->
<html>
<head>
<meta charset="utf-8">
<title>trial long page</title>
<style>
  body { margin: 0 auto; max-width: 900px; padding: 24px; font: 17px/1.5 Georgia, serif; color: #222; background: #fafafa; }
  h2 { font: 600 22px -apple-system, Helvetica, sans-serif; margin: 32px 0 8px; }
  .band { height: 40px; border-radius: 6px; margin: 12px 0; }
  code { background: #eee; padding: 0 4px; border-radius: 3px; }
</style>
</head>
<body>
<div id="content"></div>
<script>
  const words = ('lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore ' +
    'et dolore magna aliqua enim ad minim veniam quis nostrud exercitation ullamco laboris nisi aliquip ex ea ' +
    'commodo consequat duis aute irure in reprehenderit voluptate velit esse cillum fugiat nulla pariatur').split(' ');
  let seed = 7;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  const parts = [];
  for (let s = 0; s < 400; s++) {
    parts.push('<h2>Section ' + (s + 1) + '</h2>');
    for (let p = 0; p < 3; p++) {
      const n = 40 + Math.floor(rnd() * 60);
      const t = [];
      for (let i = 0; i < n; i++) t.push(words[Math.floor(rnd() * words.length)]);
      parts.push('<p>' + t.join(' ') + ' <code>item_' + s + '_' + p + '</code>.</p>');
    }
    parts.push('<div class="band" style="background:hsl(' + ((s * 37) % 360) + ',60%,70%)"></div>');
  }
  document.getElementById('content').innerHTML = parts.join('');
  // The page's own frame rate, counted only between __startRaf() and __stopRaf().
  let frames = 0, started = 0, running = false;
  const tick = () => { if (!running) return; frames++; requestAnimationFrame(tick); };
  window.__startRaf = () => { frames = 0; started = performance.now(); running = true; requestAnimationFrame(tick); return true; };
  window.__stopRaf = () => { running = false; const s = (performance.now() - started) / 1000; return { frames, seconds: s, fps: frames / s, scrollY }; };
</script>
</body>
</html>
