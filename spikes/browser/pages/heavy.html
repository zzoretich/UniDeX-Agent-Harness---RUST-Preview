<!doctype html>
<!-- Browser trial test page: content-heavy (about 30,000 DOM nodes, 300 generated images, a big
     table, web fonts from the system, CSS effects), for memory per tab. Generated, so it loads
     the same way every time and needs no network. -->
<html>
<head>
<meta charset="utf-8">
<title>trial heavy page</title>
<style>
  body { margin: 0; font: 15px/1.45 -apple-system, Helvetica, sans-serif; color: #1f2937; background: #f3f4f6; }
  header { position: sticky; top: 0; background: rgba(255,255,255,.9); backdrop-filter: blur(8px); padding: 12px 24px; box-shadow: 0 1px 6px rgba(0,0,0,.1); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; padding: 24px; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); overflow: hidden; }
  .card img { width: 100%; height: 140px; display: block; }
  .card div { padding: 10px 12px; }
  table { border-collapse: collapse; margin: 24px; background: #fff; }
  td { border: 1px solid #e5e7eb; padding: 2px 6px; font: 12px monospace; }
</style>
</head>
<body>
<header><b>Heavy page</b> generated content for the memory measurement</header>
<main id="cards"></main>
<table id="table"></table>
<script>
  const canvas = document.createElement('canvas');
  canvas.width = 520; canvas.height = 280;
  const g = canvas.getContext('2d');
  const cards = [];
  for (let i = 0; i < 300; i++) {
    const grad = g.createLinearGradient(0, 0, 520, 280);
    grad.addColorStop(0, 'hsl(' + (i * 23 % 360) + ',70%,60%)');
    grad.addColorStop(1, 'hsl(' + (i * 41 % 360) + ',70%,40%)');
    g.fillStyle = grad; g.fillRect(0, 0, 520, 280);
    for (let k = 0; k < 30; k++) {
      g.fillStyle = 'rgba(255,255,255,' + ((k % 5) / 10) + ')';
      g.beginPath(); g.arc((k * 97 + i * 13) % 520, (k * 53 + i * 7) % 280, 10 + (k % 7) * 6, 0, Math.PI * 2); g.fill();
    }
    const src = canvas.toDataURL('image/png');
    cards.push('<article class="card"><img src="' + src + '" alt=""><div><b>Card ' + (i + 1) + '</b><p>' +
      'Generated text for card ' + (i + 1) + '. '.repeat(1) + 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. '.repeat(3) +
      '</p></div></article>');
  }
  document.getElementById('cards').innerHTML = cards.join('');
  const rows = [];
  for (let r = 0; r < 1500; r++) {
    const cells = [];
    for (let c = 0; c < 12; c++) cells.push('<td>' + ((r * 31 + c * 17) % 9973) + '</td>');
    rows.push('<tr>' + cells.join('') + '</tr>');
  }
  document.getElementById('table').innerHTML = rows.join('');
  window.__nodes = document.getElementsByTagName('*').length;
</script>
</body>
</html>
