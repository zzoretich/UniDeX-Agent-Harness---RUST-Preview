[package]
name = "spike-standin"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# A helper process that needs no CEF: it paints a moving test pattern into the shared frame
# slots at a fixed rate, answers the two DevTools calls with labelled echoes, and logs the input
# it receives. It speaks the same protocol the CEF helper will.

[[bin]]
name = "spike-standin"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
spike-protocol.workspace = true
