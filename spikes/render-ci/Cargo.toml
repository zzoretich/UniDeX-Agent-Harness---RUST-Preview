# Task 13 trial: can a GPUI window render on CI runners with no GPU, can a frame be captured, and can a small
# automation socket drive the app? Throwaway code. This is its own workspace, NOT a member of the repository's
# workspace, and it has its own Cargo.lock. See docs/decisions/0013-rendering-in-ci-and-vms.md.
#
#   src/lib.rs                 no GPUI: the scene's layout, the frame check, the wire protocol helpers.
#   src/bin/render-ci.rs       the GPUI app: draws known blocks, text and a button; `--scenario` captures one frame
#                              and exits; `--automation` (feature `automation` only) opens the automation socket.
#   src/bin/render-ci-client.rs  drives the app through the socket: action, element tree, frame.
#   src/bin/frame-check.rs     checks any PNG (an in-app capture or a capture of the virtual display).
#
# Every dependency other than GPUI is pinned to the exact version GPUI's own tree already locks, so the trial adds no
# crate to the build. Licences are noted per line; all are on deny.toml's allow list.

[workspace]
resolver = "3"
members = ["."]

[package]
name = "render-ci"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[features]
# Frame capture through the framework (`Window::render_to_image`), which GPUI only compiles with its `test-support`
# feature. A build without this feature cannot read its own frames back.
capture = ["gpui/test-support", "gpui_platform/test-support"]
# The automation socket (design 10.3). Test builds only: a release build is made without it, and CI checks that its
# marker string is absent from that binary and that `--automation` is refused.
automation = ["capture"]

[dependencies]
# Copied exactly from the repository's root Cargo.toml (decision 0007).
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
anyhow = "=1.0.104" # MIT OR Apache-2.0
async-channel = "=2.5.0" # Apache-2.0 OR MIT
base64 = "=0.22.1" # MIT OR Apache-2.0
image = { version = "=0.25.10", default-features = false, features = ["png"] } # MIT OR Apache-2.0
log = "=0.4.35" # MIT OR Apache-2.0
raw-window-handle = "=0.6.2" # MIT OR Apache-2.0 OR Zlib
serde_json = "=1.0.154" # MIT OR Apache-2.0

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191" # MIT OR Apache-2.0

[target.'cfg(target_os = "linux")'.dependencies]
# Reads the app's own X11 window back (GetImage): GPUI's Linux windows do not implement `render_to_image`.
x11rb = "=0.13.2" # MIT OR Apache-2.0

[target.'cfg(target_os = "macos")'.dependencies]
# Asks the app's own content view for its accessibility children, which makes AccessKit activate (see main).
objc2 = "=0.6.5" # MIT

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] } # MIT OR Apache-2.0

[profile.release]
debug = "line-tables-only"
